<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch</title>
  <meta name="description" content="A professional, accurate stopwatch web app with lap tracking, keyboard shortcuts, and CSV export." />

  <!-- Google Fonts: Space Mono for the numeric readout, Inter for UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient background glow layers -->
  <div class="bg-glow bg-glow--one" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--two" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>

  <main class="stage">

    <!-- ============ STOPWATCH CARD ============ -->
    <section class="chrono-card" aria-label="Stopwatch">

      <header class="chrono-header">
        <div class="brand">
          <!-- Stopwatch icon (inline SVG) -->
          <svg class="brand__icon" width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="9" y="1" width="6" height="3" rx="1" fill="currentColor"/>
            <path d="M12 6.5V4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="12" cy="14" r="9" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 9v5l3.2 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19.2 5.3l1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="brand__name">stopwatch</span>
        </div>

        <!-- Status indicator: Ready / Running / Paused -->
        <div class="status" id="statusIndicator" role="status" aria-live="polite">
          <span class="status__dot" id="statusDot" aria-hidden="true"></span>
          <span class="status__label" id="statusLabel">Ready</span>
        </div>
      </header>

      <!-- Time readout -->
      <div class="readout" id="timeReadout" aria-live="off">
        <span class="readout__segment" id="hours">00</span>
        <span class="readout__colon">:</span>
        <span class="readout__segment" id="minutes">00</span>
        <span class="readout__colon">:</span>
        <span class="readout__segment" id="seconds">00</span>
        <span class="readout__colon readout__colon--ms">.</span>
        <span class="readout__segment readout__segment--ms" id="milliseconds">000</span>
      </div>
      <p class="readout__format-label">HH&nbsp;:&nbsp;MM&nbsp;:&nbsp;SS&nbsp;.&nbsp;MS</p>

      <!-- Controls -->
      <div class="controls" role="group" aria-label="Stopwatch controls">
        <button type="button" class="btn btn--primary" id="startPauseBtn" aria-label="Start stopwatch">
          <svg class="btn__icon" id="startIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg class="btn__icon" id="pauseIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
            <rect x="6" y="5" width="4" height="14" rx="1"/>
            <rect x="14" y="5" width="4" height="14" rx="1"/>
          </svg>
          <span id="startPauseLabel">Start</span>
        </button>

        <button type="button" class="btn btn--ghost" id="lapBtn" aria-label="Record lap" disabled>
          <svg class="btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 12h16M4 6h16M4 18h10" stroke-linecap="round"/>
          </svg>
          <span>Lap</span>
        </button>

        <button type="button" class="btn btn--danger" id="resetBtn" aria-label="Reset stopwatch">
          <svg class="btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 4v5h5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Reset</span>
        </button>
      </div>

      <!-- Keyboard shortcut hints -->
      <div class="shortcuts" aria-hidden="true">
        <span><kbd>Space</kbd> Start / Pause</span>
        <span><kbd>L</kbd> Lap</span>
        <span><kbd>R</kbd> Reset</span>
      </div>
    </section>

    <!-- ============ LAPS PANEL ============ -->
    <section class="laps-card" aria-label="Lap history">
      <header class="laps-header">
        <h2 class="laps-title">Lap History</h2>
        <div class="laps-header__meta">
          <span class="lap-counter" id="lapCounter">0 laps</span>
          <button type="button" class="btn btn--icon-only" id="exportBtn" aria-label="Export laps as CSV" title="Export CSV" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 3v12" stroke-linecap="round"/>
              <path d="M7 10l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 19h16" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </header>

      <ul class="laps-list" id="lapsList" aria-live="polite">
        <li class="laps-empty" id="lapsEmpty">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M4 12h16M4 6h16M4 18h10" stroke-linecap="round"/>
          </svg>
          <p>No laps recorded yet.<br>Start the stopwatch and press <kbd>L</kbd> or tap Lap.</p>
        </li>
      </ul>
    </section>

  </main>

  <!-- ============ RESET CONFIRMATION DIALOG ============ -->
  <div class="dialog-backdrop" id="dialogBackdrop" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDesc">
      <h3 id="dialogTitle">Reset stopwatch?</h3>
      <p id="dialogDesc">This will clear the current time and delete all recorded laps. This can't be undone.</p>
      <div class="dialog__actions">
        <button type="button" class="btn btn--ghost" id="dialogCancel">Cancel</button>
        <button type="button" class="btn btn--danger" id="dialogConfirm">Reset</button>
      </div>
    </div>
  </div>

  <!-- Toast notification for export / save feedback -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
